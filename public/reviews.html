<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Desert Drops — Reviews</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>

  <style>
    /* … your CSS from before … */
    .controls{ display:grid; grid-template-columns:1fr 150px 1fr auto; gap:12px; }
    .input, .select{ padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.10); background:#0f1319; color:var(--text); }
    .btn.primary{ padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.12); background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#000; font-weight:800; cursor:pointer; }
    .btn.primary:hover{ filter:brightness(1.05); }
  </style>

  <!-- Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
  <!-- … your header/nav … -->

  <section class="section" aria-label="Reviews grid">
    <div class="grid" id="grid"></div>
  </section>

  <section class="section" aria-label="Leave a review">
    <article class="card pad">
      <h2 class="h2">Leave your own review</h2>
      <form id="reviewForm" class="controls">
        <input class="input" type="text" id="name" placeholder="Your name" required>
        <select class="select" id="rating" required>
          <option value="">Rating</option>
          <option value="5">★★★★★</option>
          <option value="4">★★★★☆</option>
          <option value="3">★★★☆☆</option>
          <option value="2">★★☆☆☆</option>
          <option value="1">★☆☆☆☆</option>
        </select>
        <input class="input" type="text" id="quote" placeholder="Your thoughts…" required>
        <button class="btn primary" type="submit">Submit</button>
      </form>
    </article>
  </section>

  <footer class="footer">© 2025 • Desert Drops Studio — Reviews</footer>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAHpyl_HoRacIL-vOjnAGLInNt8wCtoTXE",
      authDomain: "desert-drops.firebaseapp.com",
      databaseURL: "https://desert-drops-default-rtdb.firebaseio.com",
      projectId: "desert-drops",
      storageBucket: "desert-drops.appspot.com",
      messagingSenderId: "439274765946",
      appId: "1:439274765946:web:e65c65740bc35f4507c5c3",
      measurementId: "G-N08F58H4LM"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const reviewsRef = db.ref('reviews');

    const grid = document.getElementById('grid');
    const form = document.getElementById('reviewForm');
    const nameInput = document.getElementById('name');
    const ratingInput = document.getElementById('rating');
    const quoteInput = document.getElementById('quote');

    function stars(n){ return '★★★★★'.slice(0,n) + '☆☆☆☆☆'.slice(0,5-n); }
    function cardHTML(r){
      return `<article class="review-card" id="${r.id}">
        <div class="pad">
          <div class="meta"><span class="name">${r.name}</span> • <span>${r.date}</span></div>
          <div class="stars">${stars(r.rating)}</div>
          <p class="quote">“${r.quote}”</p>
          <button class="delete-btn" data-id="${r.id}">Delete</button>
        </div>
      </article>`;
    }
    function render(list){ grid.innerHTML = list.map(cardHTML).join(''); }

    // Listen
    reviewsRef.on('value', snap => {
      const data = snap.val() || {};
      render(Object.values(data));
    });

    // Add
    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const rating = parseInt(ratingInput.value, 10);
      const quote = quoteInput.value.trim();
      if (!name || !quote || !(rating>=1 && rating<=5)) return;
      const id = 'r'+Date.now();
      const date = new Date().toISOString().slice(0,10);
      reviewsRef.child(id).set({id,name,rating,date,quote});
      form.reset();
    });

    // Delete
    grid.addEventListener('click', e => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      reviewsRef.child(id).remove();
    });
  </script>
</body>
</html>
