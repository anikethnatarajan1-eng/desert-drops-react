<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Desert Drops — Reviews</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg: #0b0e12;
      --card: #12161d;
      --text: #e9eef8;
      --muted: #a9b3c7;
      --accent: #ffffff;
      --accent-2: #9ef0a7;
      --shadow: 0 14px 40px rgba(0,0,0,0.45);
      --radius: 14px;
      --gap: 18px;
      --container: min(1100px, 92vw);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:
        radial-gradient(1200px 800px at 10% 0%, #0e141b, var(--bg)),
        radial-gradient(1000px 600px at 90% 110%, #0e141b, var(--bg));
      color:var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height:1.6;
    }
    a{ color:var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    header{
      position: sticky; top:0; z-index:50;
      backdrop-filter: saturate(120%) blur(8px);
      background: rgba(18,22,29,0.7);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav{ display:flex; justify-content:space-between; align-items:center; width:var(--container); margin:0 auto; padding:14px 0; }
    .brand{ display:flex; align-items:center; gap:10px; font-weight:800; }
    .brand .logo{ width:34px; height:34px; border-radius:8px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); }
    .nav-links{ display:flex; gap:16px; flex-wrap:wrap; }
    .nav-links a{ padding:8px 12px; border-radius:8px; color:var(--text); }
    .nav-links a:hover{ background:rgba(255,255,255,0.06); }
    .nav-links .active{ border:1px solid rgba(255,255,255,0.12); }

    .section{ width:var(--container); margin:28px auto; display:grid; gap:var(--gap); }
    .card{ background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)); border:1px solid rgba(255,255,255,0.08); border-radius:var(--radius); box-shadow:var(--shadow); }
    .pad{ padding:22px; }
    .title{ font-size:clamp(28px,5vw,44px); font-weight:800; margin:12px 0 10px; }
    .h2{ font-size:clamp(22px,4vw,32px); font-weight:800; margin:8px 0 10px; }
    .p{ color:var(--muted); margin:0 0 12px; }

    .grid{ display:grid; gap:18px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .review-card{
      position:relative; overflow:hidden; border-radius:12px;
      border:1px solid rgba(255,255,255,0.08); background:#0f1319;
      display:flex; flex-direction:column;
    }
    .review-card .pad{ padding:16px; }
    .name{ font-weight:800; }
    .meta{ display:flex; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:12px; }
    .stars{ color:#ffe085; font-weight:800; letter-spacing:1px; }
    .quote{ color:var(--muted); font-size:14px; margin-top:10px; }
    .delete-btn{ margin-top:10px; font-size:12px; background:rgba(255,255,255,0.08); border:none; border-radius:8px; padding:6px 10px; color:var(--muted); cursor:pointer; }
    .delete-btn:hover{ background:rgba(255,255,255,0.15); color:#fff; }

    .footer{ width:var(--container); margin:40px auto 80px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:20px; border-top:1px dashed rgba(255,255,255,0.12); padding-top:18px; }
  </style>
</head>
<body>
  <header role="banner" aria-label="Primary navigation">
    <div class="nav">
      <div class="brand" aria-label="Site brand"><div class="logo" aria-hidden="true"></div><a href="index.html" class="text">Desert Drops</a></div>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="services.html">Services</a>
        <a href="projects.html">Projects</a>
        <a href="gis.html">GIS for Good</a>
        <a href="articles.html">Articles</a>
        <a href="qna.html">Q&A</a>
        <a href="resource.html">Resources</a>
        <a href="contact.html">Contact</a>
        <a href="reviews.html" class="active">Reviews</a>
      </nav>
    </div>
  </header>

  <section class="section" aria-label="Reviews intro">
    <article class="card pad">
      <h1 class="title">Reviews that fuel the movement</h1>
      <p class="p">Real voices, big energy. A finite grid of praise — and space for yours to join in.</p>
    </article>
  </section>

  <section class="section" aria-label="Reviews grid">
    <div class="grid" id="grid"></div>
  </section>

  <section class="section" aria-label="Leave a review">
    <article class="card pad">
      <h2 class="h2">Leave your own review</h2>
      <form id="reviewForm" class="controls">
        <input class="input" type="text" id="name" placeholder="Your name" required>
        <select class="select" id="rating" required>
          <option value="">Rating</option>
          <option value="5">★★★★★</option>
          <option value="4">★★★★☆</option>
          <option value="3">★★★☆☆</option>
          <option value="2">★★☆☆☆</option>
          <option value="1">★☆☆☆☆</option>
        </select>
        <input class="input" type="text" id="quote" placeholder="Your thoughts…" required>
        <button class="btn primary" type="submit">Submit</button>
      </form>
    </article>
  </section>

  <footer class="footer" role="contentinfo">
    <div>© 2025 • Desert Drops Studio — Reviews</div>
    <div><a href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'})">Back to top</a></div>
  </footer>

  <script>
    // Seed reviews — finite, human voices
    const seed = [
      { id:'r1', name:'Aisha R.', rating:5, date:'2025-11-02', quote:'Built with heart and rigor. The site feels alive — fast, accessible, and human.' },
      { id:'r2', name:'Marco P.', rating:5, date:'2025-10-28', quote:'Conservation map made me cry. It honors people, not just pins.' },
      { id:'r3', name:'Priya S.', rating:4, date:'2025-10-09', quote:'NASA weather is clean and useful. I check it daily before bike commutes.' },
      { id:'r4', name:'Nate C.', rating:5, date:'2025-09-21', quote:'Equity playbook is the blueprint I wish we had years ago.' },
      { id:'r5', name:'Lina M.', rating:5, date:'2025-09-02', quote:'It’s not a product — it’s a movement. Every page respects the reader.' },
      { id:'r6', name:'Omar J.', rating:4, date:'2025-08-15', quote:'Performance is insane. Loads instantly even on my old phone.' },
      { id:'r7', name:'Aria K.', rating:5, date:'2025-07-12', quote:'Accessibility isn’t an afterthought here; it leads.' },
      { id:'r8', name:'Diego V.', rating:4, date:'2025-06-30', quote:'Maps that listen first — finally.' },
      { id:'r9', name:'Noor Y.', rating:5, date:'2025-06-10', quote:'The water calculator changed our daily routines.' },
      { id:'r10', name:'Kai W.', rating:3, date:'2025-05-25', quote:'Heat-safe overlays we can actually use.' }
    ];

    let reviews = [...seed];

    const grid = document.getElementById('grid');
    const form = document.getElementById('reviewForm');
    const nameInput = document.getElementById('name');
    const ratingInput = document.getElementById('rating');
    const quoteInput = document.getElementById('quote');

    function stars(n){
      return '★★★★★'.slice(0,n) + '☆☆☆☆☆'.slice(0,5-n);
    }

    function cardHTML(r){
      const deleteBtn = r.id.startsWith('u')
        ? `<button class="delete-btn" aria-label="Delete your review" data-id="${r.id}">Delete</button>`
        : '';
      return `
        <article class="review-card" id="${r.id}">
          <div class="pad">
            <div class="meta"><span class="name">${r.name}</span> • <span>${r.date}</span></div>
            <div class="stars" aria-label="${r.rating} out of 5 stars">${stars(r.rating)}</div>
            <p class="quote">“${r.quote}”</p>
            ${deleteBtn}
          </div>
        </article>
      `;
    }

    function render(list){
      grid.innerHTML = list.map(cardHTML).join('');
    }

    // Initial render
    render(reviews);

    // Add new review (1–5 stars), mark user reviews with 'u' id so only they get delete
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const rating = parseInt(ratingInput.value, 10);
      const quote = quoteInput.value.trim();
      if (!name || !quote || !(rating >= 1 && rating <= 5)) return;

      const date = new Date().toISOString().slice(0,10);
      const newReview = { id:'u'+Date.now(), name, rating, date, quote };
      reviews.push(newReview);
      render(reviews);
      form.reset();
      nameInput.focus();
    });

    // Delegated delete: only user-submitted reviews have a delete button
    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      reviews = reviews.filter(r => r.id !== id);
      render(reviews);
    });
  </script>
</body>
</html>
